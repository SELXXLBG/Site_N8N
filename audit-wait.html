<!DOCTYPE html>
<html lang="fr" data-lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Audit en cours… | Nexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f172a'/%3E%3Ctext x='50' y='68' text-anchor='middle' font-family='Arial Black%2C sans-serif' font-weight='900' font-size='66' fill='%237c3aed'%3EN%3C%2Ftext%3E%3C%2Fsvg%3E">
    <style>
        :root {
            --purple: #7c3aed;
            --blue: #3b82f6;
            --grad: linear-gradient(135deg, #7c3aed, #3b82f6);
            --bg: #0a0a0a;
            --card: rgba(31, 41, 55, 0.7);
            --border: rgba(124, 58, 237, 0.25);
            --text: #f9fafb;
            --muted: #9ca3af;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.18) 0%, transparent 70%);
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            animation: drift-orb 10s ease-in-out infinite alternate;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
            bottom: -100px;
            right: -80px;
            animation: drift-orb 14s ease-in-out infinite alternate-reverse;
        }

        @keyframes drift-orb {
            from {
                transform: translateX(-50%) scale(1);
            }

            to {
                transform: translateX(-50%) scale(1.12);
            }
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px);
            background-size: 32px 32px;
            z-index: 0;
        }

        /* lang switcher */
        .lang-bar {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 100;
            display: flex;
            gap: 6px;
        }

        .lang-btn {
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(124, 58, 237, 0.3);
            background: rgba(31, 41, 55, 0.7);
            color: #9ca3af;
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
            letter-spacing: 0.04em;
        }

        .lang-btn.active {
            background: var(--grad);
            color: #fff;
            border-color: transparent;
        }

        /* container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem;
            text-align: center;
        }

        .brand {
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 2rem;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 24px;
            padding: 2.5rem 2rem 2rem;
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(124, 58, 237, 0.1) inset;
        }

        /* spinner */
        .spinner-wrap {
            width: 90px;
            height: 90px;
            margin: 0 auto 1.75rem;
            position: relative;
        }

        .ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid transparent;
        }

        .ring-outer {
            border-top-color: var(--purple);
            border-right-color: var(--purple);
            animation: spin 1.4s linear infinite;
        }

        .ring-inner {
            inset: 12px;
            border-bottom-color: var(--blue);
            border-left-color: var(--blue);
            animation: spin 0.9s linear infinite reverse;
        }

        .spinner-icon {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 900;
            line-height: 1.15;
            margin-bottom: 0.75rem;
            background: linear-gradient(to right, #fff, #c4b5fd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* steps */
        .steps {
            list-style: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            font-size: 0.9rem;
            color: var(--muted);
            transition: color 0.4s;
        }

        .step.done {
            color: #d1fae5;
        }

        .step.active {
            color: #fff;
        }

        .step-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            flex-shrink: 0;
            transition: all 0.4s;
        }

        .step.pending .step-dot {
            border: 2px solid #374151;
            color: #374151;
        }

        .step.active .step-dot {
            border: 2px solid var(--purple);
            background: rgba(124, 58, 237, 0.15);
            color: var(--purple);
            animation: pulse-dot 1.2s ease-in-out infinite;
        }

        .step.done .step-dot {
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid #10b981;
            color: #10b981;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                box-shadow: 0 0 8px rgba(124, 58, 237, 0.4);
            }

            50% {
                box-shadow: 0 0 20px rgba(124, 58, 237, 0.8);
            }
        }

        /* progress */
        .progress-wrap {
            background: rgba(55, 65, 81, 0.5);
            border-radius: 99px;
            height: 6px;
            overflow: hidden;
            margin-bottom: 1.5rem;
        }

        .progress-bar {
            height: 100%;
            border-radius: 99px;
            background: var(--grad);
            width: 0%;
            transition: width 0.8s cubic-bezier(.4, 0, .2, 1);
            box-shadow: 0 0 12px rgba(124, 58, 237, 0.6);
        }

        /* timer */
        .timer-line {
            color: var(--muted);
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .timer-line strong {
            color: #c4b5fd;
            font-variant-numeric: tabular-nums;
        }

        /* file chip */
        .file-chip {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 0.85rem 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .file-emoji {
            font-size: 1.8rem;
        }

        .file-meta h4 {
            font-size: 0.88rem;
            color: #fff;
            margin-bottom: 0.2rem;
        }

        .file-badge {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--purple);
            background: rgba(124, 58, 237, 0.1);
            border: 1px solid rgba(124, 58, 237, 0.25);
            padding: 2px 8px;
            border-radius: 20px;
            letter-spacing: 0.05em;
        }

        .file-badge.ready {
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.25);
        }

        .footer-note {
            margin-top: 1.5rem;
            font-size: 0.78rem;
            color: #4b5563;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }
    </style>
</head>

<body>
    <!-- Lang switcher -->
    <div class="lang-bar">
        <button class="lang-btn active" id="btn-fr" onclick="setLang('fr')">🇫🇷 FR</button>
        <button class="lang-btn" id="btn-en" onclick="setLang('en')">🇬🇧 EN</button>
    </div>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="brand"><span style="opacity:0.5;font-weight:700;font-size:0.85em">N //</span> NEXUS</div>

        <div class="card">
            <div class="spinner-wrap" id="spinner">
                <div class="ring ring-outer"></div>
                <div class="ring ring-inner"></div>
                <div class="spinner-icon">🤖</div>
            </div>

            <h1 id="main-title"></h1>
            <p class="subtitle" id="main-sub"></p>

            <div class="file-chip">
                <div class="file-emoji">📋</div>
                <div class="file-meta">
                    <h4>Nexus_Audit_Ecommerce.pdf</h4>
                    <span class="file-badge" id="file-badge"></span>
                </div>
            </div>

            <ul class="steps" id="steps-list">
                <li class="step done" id="step-0">
                    <div class="step-dot">✓</div>
                    <span id="step-0-text"></span>
                </li>
                <li class="step active" id="step-1">
                    <div class="step-dot">◉</div>
                    <span id="step-1-text"></span>
                </li>
                <li class="step pending" id="step-2">
                    <div class="step-dot">○</div>
                    <span id="step-2-text"></span>
                </li>
                <li class="step pending" id="step-3">
                    <div class="step-dot">○</div>
                    <span id="step-3-text"></span>
                </li>
                <li class="step pending" id="step-4">
                    <div class="step-dot">○</div>
                    <span id="step-4-text"></span>
                </li>
            </ul>

            <div class="progress-wrap">
                <div class="progress-bar" id="progress"></div>
            </div>

            <div class="timer-line" id="timer-line">
                <span id="timer-label"></span>&nbsp;<strong id="countdown">2:00</strong>
            </div>
        </div>

        <div class="footer-note" id="footer-note"></div>
    </div>

    <script>
        // ── Translations ──
        const i18n = {
            fr: {
                title_loading: 'Votre audit<br>est en cours…',
                title_done: 'Votre audit est<br>dans votre boîte mail !',
                sub_loading: 'Notre IA analyse votre boutique et prépare vos recommandations personnalisées.',
                sub_done: "Consultez votre email — si vous ne voyez rien d'ici 5 min, vérifiez vos spams.",
                badge_loading: 'EN GÉNÉRATION…',
                badge_done: 'ENVOYÉ PAR EMAIL ✓',
                steps: [
                    'Formulaire reçu & données sécurisées',
                    'Analyse de votre profil e-commerce',
                    'Génération des recommandations IA',
                    'Mise en page du rapport PDF',
                    'Envoi par email à votre adresse'
                ],
                timer_label: '⏱ Disponible dans environ',
                footer: '🔒 Vos données sont traitées de manière confidentielle'
            },
            en: {
                title_loading: 'Your audit<br>is being generated…',
                title_done: 'Your audit is<br>in your inbox!',
                sub_loading: 'Our AI is analysing your store and preparing your personalised recommendations.',
                sub_done: "Check your email — if you don't see anything within 5 min, check your spam folder.",
                badge_loading: 'GENERATING…',
                badge_done: 'SENT BY EMAIL ✓',
                steps: [
                    'Form received & data secured',
                    'Analysing your e-commerce profile',
                    'Generating AI recommendations',
                    'Formatting the PDF report',
                    'Sending to your email address'
                ],
                timer_label: '⏱ Ready in approximately',
                footer: '🔒 Your data is handled confidentially'
            }
        };

        // ── State ──
        let lang = 'fr';
        let elapsed = 0;
        let finished = false;
        const TOTAL = 120;
        const STEPS_TIMING = [
            { id: 'step-1', activate: 0, complete: 22, progress: 20 },
            { id: 'step-2', activate: 22, complete: 55, progress: 50 },
            { id: 'step-3', activate: 55, complete: 95, progress: 78 },
            { id: 'step-4', activate: 95, complete: 118, progress: 95 },
        ];

        // ── Render by lang ──
        function render() {
            const t = i18n[lang];
            document.documentElement.lang = lang;
            document.getElementById('main-title').innerHTML = finished ? t.title_done : t.title_loading;
            document.getElementById('main-sub').textContent = finished ? t.sub_done : t.sub_loading;
            document.getElementById('file-badge').textContent = finished ? t.badge_done : t.badge_loading;
            document.getElementById('timer-label').textContent = t.timer_label;
            document.getElementById('footer-note').textContent = t.footer;
            t.steps.forEach((s, i) => {
                const el = document.getElementById(`step-${i}-text`);
                if (el) el.textContent = s;
            });
        }

        function setLang(l) {
            lang = l;
            document.getElementById('btn-fr').classList.toggle('active', l === 'fr');
            document.getElementById('btn-en').classList.toggle('active', l === 'en');
            try { localStorage.setItem('autoflow-wait-lang', l); } catch (e) { }
            render();
        }

        // ── Countdown helpers ──
        function fmt(s) {
            const m = Math.floor(s / 60);
            const sec = s % 60;
            return `${m}:${String(sec).padStart(2, '0')}`;
        }

        function setStep(id, state) {
            const el = document.getElementById(id);
            if (!el) return;
            el.className = 'step ' + state;
            const dot = el.querySelector('.step-dot');
            dot.textContent = state === 'done' ? '✓' : state === 'active' ? '◉' : '○';
        }

        // ── Tick ──
        function tick() {
            elapsed++;
            const remaining = Math.max(0, TOTAL - elapsed);
            document.getElementById('countdown').textContent = fmt(remaining);

            STEPS_TIMING.forEach(step => {
                if (elapsed >= step.complete) setStep(step.id, 'done');
                else if (elapsed >= step.activate) setStep(step.id, 'active');
                if (elapsed >= step.activate && elapsed < step.complete) {
                    document.getElementById('progress').style.width = step.progress + '%';
                }
            });

            if (elapsed >= TOTAL) {
                clearInterval(timer);
                finished = true;
                document.getElementById('progress').style.width = '100%';
                document.getElementById('file-badge').classList.add('ready');
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('timer-line').style.display = 'none';
                render();
            }
        }

        // ── Init ──
        (function init() {
            // Detect lang from URL param, localStorage, or browser
            const urlLang = new URLSearchParams(window.location.search).get('lang');
            let saved = null;
            try { saved = localStorage.getItem('autoflow-wait-lang'); } catch (e) { }
            const browserLang = navigator.language || 'fr';
            const detected = urlLang || saved || (browserLang.startsWith('en') ? 'en' : 'fr');
            setLang(detected);

            // Start progress
            document.getElementById('progress').style.width = '5%';
            render();

            window.timer = setInterval(tick, 1000);
        })();
    </script>
</body>

</html>
